name: Build image

on:
  push:
    branches: [main]
    paths: [Dockerfile, fax2mail.sh, .github/workflows/build.yml]
  schedule:
    - cron: "0 3 * * 1"      # every Monday 03:00 UTC: fresh packages from Debian sid
  workflow_dispatch:          # manual trigger via "Run workflow"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/docker-asterisk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Date tag
        id: date
        run: echo "tag=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          no-cache: true        # otherwise the apt step would come from cache and nothing would update
          provenance: false     # one manifest per version, so cleanup works reliably
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.date.outputs.tag }}

      - name: Delete old versions (keep the newest 8)
        uses: actions/delete-package-versions@v5
        with:
          package-name: docker-asterisk
          package-type: container
          min-versions-to-keep: 8
